# Проверка каждого push и pull request: типы, линтер, тексты, unit-тесты, сборка и e2e (Playwright).
# Ключи для тестового сервера задаёт playwright.config.ts — секреты репозитория не нужны.
name: Проверка

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm — из поля packageManager в package.json, Node — из .nvmrc.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Браузер для e2e
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
